name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test, and lint
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android API 35 and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK and run unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon --console=plain --stacktrace :app:lintDebug

      - name: Stage downloadable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BT-Woofer-Audio-Link-debug.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: BT-Woofer-Audio-Link-debug
          path: BT-Woofer-Audio-Link-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_SHA}"
          title="BT Woofer Audio Link ${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" BT-Woofer-Audio-Link-debug.apk --clobber
          else
            gh release create "$tag" BT-Woofer-Audio-Link-debug.apk \
              --title "$title" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi

  deploy-pages:
    name: Deploy sender website to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: ${{ secrets.GH_PAGES_ADMIN_TOKEN != '' }}
          token: ${{ secrets.GH_PAGES_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload website files
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5